name: alt_celery3_contract

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.13
  - pip>=25.0
  - pip:
      # 以可编辑模式安装本包并附带开发 + 文档依赖
      - -e .[dev,docs]
